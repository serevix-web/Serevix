<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Serevix</title>
<meta name="description" content="Gym y running: series guiadas, NPC en 3D, retos, actividades y comida.">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Serevix">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: app de una columna (máx. 560px) sobre negro puro. En Hoy, escenario 3D con el NPC arriba,
     racha y calibración debajo, y las tarjetas de ejercicio con su mapa muscular. Barra de 5 pestañas fija abajo.
     Paleta: lila = lo que trabajas y lo que mejora; blanco = texto y correr; grises y negro para todo lo demás. */
  --bg:#000000; --surface:#0C0B11; --surface-2:#14131A; --surface-3:#1C1A24; --line:#26232F; --line-2:#36323F;
  --ink:#F6F4FB; --muted:#A09CAE; --dim:#6F6B7D;
  --lila:#B79BFF; --lila-hi:#DACCFF; --lila-mid:#8C6CF2; --lila-deep:#5B42B8;
  --lila-soft:rgba(183,155,255,.12); --lila-line:rgba(183,155,255,.38); --lila-glow:rgba(183,155,255,.5);
  --on-lila:#0B0716; --danger:#FFA3C8; --danger-soft:rgba(255,163,200,.12);
  --f-display:"Chakra Petch","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --tabh:66px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:#000}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 28px)}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--lila)}
:focus-visible{outline:2px solid var(--lila);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #121117}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:22px;height:22px;perspective:140px;flex:none}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin3d 9s linear infinite}
.cube i{position:absolute;inset:0;border:1.5px solid var(--lila);background:transparent;box-shadow:0 0 6px rgba(183,155,255,.35)}
.cube i:nth-child(1){transform:translateZ(var(--h,11px))} .cube i:nth-child(2){transform:rotateY(180deg) translateZ(var(--h,11px))}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(var(--h,11px))} .cube i:nth-child(4){transform:rotateY(-90deg) translateZ(var(--h,11px))}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(var(--h,11px))} .cube i:nth-child(6){transform:rotateX(-90deg) translateZ(var(--h,11px))}
@keyframes spin3d{from{transform:rotateX(-26deg) rotateY(0)}to{transform:rotateX(-26deg) rotateY(360deg)}}
.brand-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.mark{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.24em;text-transform:uppercase;background:linear-gradient(90deg,#fff 0%,var(--lila-hi) 45%,var(--lila) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.sync[data-s="saved"]::before{background:var(--lila);box-shadow:0 0 8px var(--lila)}
.sync[data-s="saving"]::before{background:var(--lila-hi)}
.sync[data-s="local"]::before,.sync[data-s="offline"]::before{background:#fff}
.chips{display:flex;gap:8px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;text-decoration:none;color:var(--ink)}
.chip svg.i{color:var(--lila);width:17px;height:17px}
.chip.hot{border-color:var(--lila-line);box-shadow:0 0 14px -4px var(--lila-glow)}
.chip.lvl{color:var(--muted)} .chip.lvl b{color:var(--lila);margin-left:3px}

.hero-day{padding-block:14px 2px}
.eyebrow{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.04;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.06em;text-wrap:balance}
h3{margin:0}
.lead{margin:8px 0 0;color:var(--muted);font-size:15px}
.link{color:var(--lila);font-weight:600;font-size:15px;text-decoration:none;padding:6px 0;display:inline-block}

/* escenario 3D */
.stage{position:relative;margin-top:12px;height:350px;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(110% 60% at 50% 100%,rgba(140,108,242,.24),rgba(0,0,0,0) 62%),#000;scroll-margin-top:72px}
.stage::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(218,204,255,.18),inset 0 -40px 60px -40px rgba(183,155,255,.25)}
.stage-slot{position:absolute;inset:0}
.stage-slot canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.stage-fallback{position:absolute;inset:58px 16px 64px;display:flex;align-items:center;justify-content:center}
.stage-fallback .bodymap{height:100%;width:auto;max-width:100%}
.stage-slot.live .stage-fallback{display:none}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:14px}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hud-top>div{min-width:0}
.hud-name{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;text-transform:uppercase;letter-spacing:.05em;text-shadow:0 2px 14px #000}
.hud-nav{display:flex;gap:6px;pointer-events:auto;flex:none}
.hud-nav button{width:40px;height:40px;border-radius:12px;background:rgba(12,11,17,.72);border:1px solid var(--line-2);display:grid;place-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hud-nav .prev svg{transform:rotate(180deg)}
.hud-bottom{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:space-between}
.hud-hint{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-weight:600}

/* racha */
.streak{position:relative;margin-top:12px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(120deg,#120F1A,#07060A 60%);overflow:hidden}
.streak.hot{border-color:var(--lila-line);box-shadow:0 18px 50px -30px var(--lila-glow)}
.streak.hot::before{content:"";position:absolute;inset:-40% -10% auto auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(183,155,255,.28),transparent 65%);pointer-events:none}
.flame3d{width:50px;height:62px;perspective:220px;flex:none;position:relative}
.fl{position:absolute;inset:0;transform-style:preserve-3d;animation:fspin 3.6s linear infinite}
.fl i{position:absolute;left:8px;top:16px;width:34px;height:34px;border-radius:50% 0 50% 50%;background:linear-gradient(225deg,#fff 0%,var(--lila-hi) 28%,var(--lila) 62%,var(--lila-deep) 100%);opacity:.82;box-shadow:0 0 18px var(--lila-glow)}
.fl i:nth-child(1){transform:rotateY(0deg) rotate(-45deg)}
.fl i:nth-child(2){transform:rotateY(60deg) rotate(-45deg)}
.fl i:nth-child(3){transform:rotateY(120deg) rotate(-45deg)}
@keyframes fspin{0%{transform:rotateY(0) scaleY(1)}50%{transform:rotateY(180deg) scaleY(1.1)}100%{transform:rotateY(360deg) scaleY(1)}}
.streak.cold .fl i{background:linear-gradient(225deg,#9A97A6,#3A3745);box-shadow:none;opacity:.6}
.streak.cold .fl{animation-duration:9s}
.st-col{display:flex;flex-direction:column;min-width:0}
.st-num{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.streak.hot .st-num{background:linear-gradient(180deg,#fff,var(--lila));-webkit-background-clip:text;background-clip:text;color:transparent}
.st-lbl{font-size:13px;font-weight:600;color:var(--muted)}
.st-weeks{margin-left:auto;align-items:flex-end;text-align:right}
.st-weeks .st-num{font-size:28px}
.chain{display:flex;gap:4px;margin-top:6px}
.chain i{width:12px;height:13px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--surface-3)}
.chain i.on{background:var(--lila);box-shadow:0 0 8px var(--lila)}
.chain i.cur{background:var(--lila-deep)}
.chain i.cur.on{background:var(--lila-hi)}
.st-badge{position:absolute;top:10px;left:72px}

.week{list-style:none;margin:14px 0 4px;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week li{display:flex;flex-direction:column;align-items:center;gap:4px}
.week .wd{font-size:12px;font-weight:700;color:var(--dim)}
.week .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);font-family:var(--f-display);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}
.week .dot svg.i{width:18px;height:18px;stroke-width:2.6}
.week .done .dot{background:var(--lila);border-color:var(--lila);color:var(--on-lila);box-shadow:0 0 14px -2px var(--lila-glow)}
.week .miss .dot{border-style:dashed;color:var(--dim)}
.week .off .dot{border-color:transparent;color:var(--dim);background:var(--surface-2)}
.week .today .dot{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.week .today.done .dot{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff,0 0 18px var(--lila-glow)}

.note{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--lila-soft);border:1px solid var(--lila-line);font-size:14px}
.note p{margin:0;flex:1;min-width:0}
.calib{margin-top:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.calib-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.calib-head b{font-family:var(--f-display);font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.calib p{margin:0;color:var(--muted);font-size:14px}
.calib .pbar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.calib .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lila-deep),var(--lila));box-shadow:0 0 10px var(--lila-glow)}
.ready{margin-top:12px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:linear-gradient(120deg,rgba(183,155,255,.22),rgba(91,66,184,.12));border:1px solid var(--lila-line)}
.ready p{margin:0;flex:1;font-size:14px}
.ready strong{display:block;font-family:var(--f-display);font-size:17px;text-transform:uppercase;letter-spacing:.04em}

.stack{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.card{position:relative;background:linear-gradient(180deg,#110F17 0%,#09080D 100%);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card::before{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(218,204,255,.5),transparent);pointer-events:none}
.ex{padding:16px;display:flex;flex-direction:column;gap:14px}
.ex.complete{border-color:var(--lila-line);box-shadow:0 18px 50px -30px var(--lila-glow)}
.ex-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ex-head>div{min-width:0}
.ex-head h3{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.2;letter-spacing:.02em}
.meta{margin:2px 0 0;color:var(--muted);font-size:14px}
.ex-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.count{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--dim);font-variant-numeric:tabular-nums}
.complete .count{color:var(--lila)}
.cal-hint{margin:0;display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--lila-hi);background:var(--lila-soft);border:1px dashed var(--lila-line);padding:8px 10px;border-radius:10px}
.cal-hint svg.i{width:16px;height:16px;margin-top:2px}

.mus-row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.mus-row .bodymap{width:100px;height:100px;flex:none}
.mus-info{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1;align-items:flex-start}
.mus-k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mus-empty{font-size:13px;color:var(--muted);margin:0}
.mchips{display:flex;flex-wrap:wrap;gap:5px}
.mchip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;line-height:1.35;white-space:nowrap}
.mchip.p{background:var(--lila);color:var(--on-lila);box-shadow:0 0 12px -3px var(--lila-glow)}
.mchip.s{border:1px solid var(--lila-line);color:var(--lila-hi);background:rgba(0,0,0,.35)}
.btn-3d{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--lila);padding:7px 11px;border-radius:10px;border:1px solid var(--lila-line);background:var(--lila-soft)}
.btn-3d svg.i{width:17px;height:17px}
.btn-3d.on{background:var(--lila);color:var(--on-lila);border-color:var(--lila)}
.bodymap .sil{fill:#131219;stroke:#34303F;stroke-width:.8}
.bodymap .m-n{fill:#24222D}
.bodymap .m-s{fill:#5E4BA8}
.bodymap .m-p{fill:var(--lila);animation:mpulse 1.8s ease-in-out infinite}
@keyframes mpulse{50%{fill:#ECE4FF}}
.bodymap text{fill:var(--dim);font-size:8px;font-family:var(--f-body);font-weight:600;letter-spacing:.1em}

.load{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line-2);display:grid;place-items:center;background:var(--surface-2);flex:none;transition:transform .12s}
.step-btn:active,.ms button:active{transform:perspective(200px) rotateX(18deg) scale(.94)}
.load-val{display:flex;align-items:baseline;gap:2px;justify-content:center}
.big-in{width:98px;text-align:center;font-family:var(--f-display);font-weight:600;font-size:40px;line-height:1;padding:2px 0;background:transparent;border:1px dashed transparent;border-radius:10px;font-variant-numeric:tabular-nums}
.big-in:hover{border-color:var(--line-2)}
.unit{font-family:var(--f-display);font-weight:500;font-size:17px;color:var(--muted)}
.num{font-family:var(--f-display);font-weight:600;font-size:42px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ms{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.ms>span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ms>div{display:flex;align-items:center;gap:4px}
.ms button{width:34px;height:34px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;transition:transform .12s}
.ms button svg.i{width:16px;height:16px}
.ms input{width:52px;text-align:center;padding:6px 2px;font-family:var(--f-display);font-weight:600;font-size:19px;background:transparent;border-color:transparent;font-variant-numeric:tabular-nums}
.plates-wrap{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0;max-width:100%}
.plates{display:block;max-width:100%;height:auto}
.plates .bar{fill:#8D8A99}
.p25{fill:#8C6CF2} .p20{fill:#B79BFF} .p15{fill:#DACCFF} .p10{fill:#F6F4FB} .p5{fill:#A09CAE} .p2{fill:#6F6B7D} .p1{fill:#4A4756}
.plates-txt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.sets{display:flex;flex-wrap:wrap;gap:10px}
.set{width:50px;height:50px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;background:var(--surface-2);transition:background-color .15s,border-color .15s,transform .1s}
.set:active{transform:scale(.93)}
.set.on{background:var(--lila);border-color:var(--lila);color:var(--on-lila);box-shadow:0 0 18px -2px var(--lila-glow)}
.set.on svg.i{width:22px;height:22px;stroke-width:2.8}
.set.flip{animation:flip .55s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:perspective(240px) rotateY(180deg) scale(.85)}to{transform:perspective(240px) rotateY(0) scale(1)}}
.rate{display:flex;flex-direction:column;gap:8px}
.rate-q{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rate-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rb{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:700;font-size:15px;transition:transform .15s}
.rb small{font-size:11px;font-weight:500;color:var(--muted)}
.rb.on{background:var(--lila);border-color:var(--lila);color:var(--on-lila);transform:perspective(300px) translateZ(8px);box-shadow:0 0 18px -4px var(--lila-glow)}
.rb.on small{color:var(--on-lila);opacity:.75}
.next{margin:0;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.next.is-up{color:var(--lila-hi);background:var(--lila-soft);border:1px solid var(--lila-line);padding:8px 12px;border-radius:10px;font-weight:500}
.next.is-down{color:var(--danger);background:var(--danger-soft);border:1px solid rgba(255,163,200,.35);padding:8px 12px;border-radius:10px;font-weight:500}
.next svg.i{width:18px;height:18px}

.lane{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background-color:#18161F;color:#fff;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:15px;background-image:repeating-linear-gradient(180deg,transparent 0 10px,rgba(255,255,255,.13) 10px 11px)}
.lane-n{font-weight:600;font-size:12px;letter-spacing:.1em;text-align:right;color:var(--lila-hi)}
.run-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.run-target{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.run-target .pace-t{font-family:var(--f-display);font-size:20px;font-weight:600;color:var(--lila-hi);margin-left:6px}
.run-target .lbl{color:var(--muted);font-size:14px;margin-left:4px}
.run-form{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5;min-height:180px}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lila);outline-offset:0}
input[type="checkbox"]{width:22px;height:22px;padding:0;flex:none;accent-color:var(--lila);margin:1px 0 0}
.pace{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.err{margin:0;color:var(--danger);font-size:14px;font-weight:500}
.run-done{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.run-done.hit{background:var(--lila-soft);border-color:var(--lila-line);color:var(--lila-hi)}
.rd-main{display:flex;align-items:center;gap:8px;font-size:17px;flex-wrap:wrap}
.rd-pace{font-family:var(--f-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.pace-cmp{margin:0;font-size:14px;font-weight:600}
.pace-cmp.good{color:var(--lila)} .pace-cmp.bad{color:var(--danger)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.file-btn{position:relative;cursor:pointer}
.file-btn svg.i{width:17px;height:17px}
.add-run{width:100%;padding:14px;border:1.5px dashed var(--line-2);border-radius:var(--r);color:var(--ink);font-weight:600;text-align:center}
.rest-day{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.rest-day p{margin:0;color:var(--muted)}
.gm{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.gm-head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.gm-head .hint{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.route{width:100%;height:auto;display:block;border-radius:12px;background:#07060B}
.route .rg{stroke:#17151F;stroke-width:1}
.route .rt-glow{fill:none;stroke:rgba(183,155,255,.35);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.route .rt{fill:none;stroke:var(--lila);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.route .rs{fill:#fff} .route .re{fill:var(--lila);stroke:#fff;stroke-width:1.5}
.route text{fill:var(--muted);font-size:9px;font-family:var(--f-body)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{display:flex;flex-direction:column;padding:8px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.stats span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats b{font-family:var(--f-display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.splits{width:100%;height:auto;display:block}
.splits rect{fill:var(--lila-deep)} .splits rect.best{fill:var(--lila)}
.splits text{fill:var(--muted);font-size:9px;font-family:var(--f-body)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:16px;border:1px solid transparent;white-space:nowrap;text-decoration:none;transition:transform .12s}
.btn:active{transform:perspective(300px) rotateX(10deg) scale(.97)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.primary{background:linear-gradient(180deg,var(--lila-hi),var(--lila));color:var(--on-lila);box-shadow:0 10px 28px -12px var(--lila-glow)}
.btn.run{background:#fff;color:#000}
.btn.claim{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--lila-hi),var(--lila));color:var(--on-lila);box-shadow:0 0 22px -6px var(--lila-glow)}
.btn.claim::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);transform:translateX(-120%);animation:shine 2.4s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.btn.ghost{border-color:var(--line-2);background:var(--surface-2);color:var(--ink)}
.btn.danger{border-color:var(--line-2);background:var(--surface-2);color:var(--danger)}
.btn[data-armed="1"]{background:var(--danger);color:#000;border-color:var(--danger)}

.sec{margin-top:28px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.sec-sub{margin:-6px 0 10px;color:var(--muted);font-size:14px}
.ch-list{display:flex;flex-direction:column;gap:8px}
.ch{background:linear-gradient(180deg,#100E16,#0A090E);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.ch h4{margin:0;font-size:16px;font-weight:600;line-height:1.25;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ch p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ch .ch-act{display:flex;gap:6px;align-items:center;justify-self:end}
.ch .pbar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.ch .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lila-deep),var(--lila));border-radius:inherit;box-shadow:0 0 10px var(--lila-glow)}
.ch.done{border-color:var(--lila-line)}
.ch.claimed{background:var(--lila-soft);border-color:transparent}
.ch-prog{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.ch.flash{animation:flip3d .8s cubic-bezier(.2,.8,.2,1)}
@keyframes flip3d{from{transform:perspective(700px) rotateX(0)}to{transform:perspective(700px) rotateX(360deg)}}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-3);color:var(--muted);line-height:1.2;white-space:nowrap}
.tag.mine,.tag.lila{background:var(--lila-soft);color:var(--lila-hi);border:1px solid var(--lila-line)}
.tag.solid{background:var(--lila);color:var(--on-lila)}
.xp-got{display:inline-flex;gap:4px;align-items:center;font-weight:700;color:var(--lila);font-size:14px;white-space:nowrap}
.xp-got svg.i{width:16px;height:16px;stroke-width:2.6}
.counter{display:flex;gap:6px}
.counter button{min-height:36px;min-width:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.del-x{color:var(--muted);font-size:13px;font-weight:600;padding:6px 4px}
.del-x[data-armed="1"]{color:var(--danger)}

.retos-hero{display:flex;align-items:center;gap:16px}
.medal{width:86px;height:86px;perspective:420px;flex:none}
.coin{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:coin 7s ease-in-out infinite}
.coin span{position:absolute;inset:0;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
.coin .face{display:grid;place-items:center;background:linear-gradient(145deg,#fff 0%,var(--lila-hi) 25%,var(--lila) 55%,var(--lila-deep) 100%);color:var(--on-lila);font-family:var(--f-display);font-weight:700;font-size:34px;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.coin .f1{transform:translateZ(5px)} .coin .f2{transform:rotateY(180deg) translateZ(5px)}
.coin .edge{background:var(--lila-deep)}
.coin .e1{transform:translateZ(-3px)} .coin .e2{transform:translateZ(0)} .coin .e3{transform:translateZ(3px)}
@keyframes coin{0%{transform:rotateY(-25deg) rotateX(10deg)}50%{transform:rotateY(155deg) rotateX(-8deg)}100%{transform:rotateY(335deg) rotateX(10deg)}}
.lvlbar{margin-top:14px;height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.lvlbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lila-deep),var(--lila),var(--lila-hi));box-shadow:0 0 12px var(--lila-glow)}
.lvl-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.awards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.awards li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.awards li span:last-child{color:var(--lila);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.awards small{display:block;color:var(--muted);font-size:13px}

.days,.lib{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.lib{margin-top:0}
.day-row,.lib-row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(180deg,#100E16,#0A090E);border:1px solid var(--line);border-radius:16px;text-align:left;transition:transform .15s,border-color .15s}
.day-row:active,.lib-row:active{transform:perspective(700px) rotateX(6deg) scale(.985)}
.day-row.is-today{border-color:var(--lila-line);box-shadow:0 0 0 1px rgba(183,155,255,.15)}
.dn{font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;width:38px;flex:none;letter-spacing:.04em}
.is-today .dn{color:var(--lila)}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:4px;height:22px;border-radius:2px;background:var(--surface-3)}
.pips i.g{background:var(--lila);box-shadow:0 0 8px var(--lila-glow)} .pips i.r{background:#fff}
.db{display:flex;flex-direction:column;min-width:0;flex:1}
.db strong{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-row>svg.i,.lib-row>svg.i{color:var(--dim);width:18px;height:18px}
.routine-card{padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:14px;background:linear-gradient(130deg,#1A1428,#0A090E 65%);border-color:var(--lila-line)}
.routine-card p{margin:0;color:var(--muted);font-size:14px}
.settings{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.switch{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.hint{margin:0;font-size:13px;color:var(--muted)}
.rt-prev{display:flex;flex-direction:column;gap:6px}
.rt-day{display:flex;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.rt-day b{font-family:var(--f-display);text-transform:uppercase;width:34px;flex:none}
.rt-day div{display:flex;flex-wrap:wrap;gap:4px;min-width:0}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.tile{position:relative;background:linear-gradient(180deg,#121019,#09080D);border:1px solid var(--line);border-radius:16px;padding:12px;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--lila),transparent)}
.tile .tl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tile .tv{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .tv small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
.chart-box{background:linear-gradient(180deg,#100E16,#09080D);border:1px solid var(--line);border-radius:16px;padding:12px 10px 6px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.chart .b-run{fill:#fff;opacity:.4} .chart .b-gym{fill:var(--lila);opacity:.45}
.chart .cur{opacity:1}
.chart text.vl{fill:var(--ink);font-weight:700;font-size:11px}
.chart .base{stroke:var(--dim);stroke-dasharray:3 4;stroke-width:1}
.chart .lc{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .lc.gym{stroke:var(--lila)} .chart .lc.run{stroke:#fff}
.chart .dot{fill:#000;stroke-width:2} .chart .dot.gym{stroke:var(--lila)} .chart .dot.run{stroke:#fff}
.chart .end.gym{fill:var(--lila)} .chart .end.run{fill:#fff}
#view.enter .chart rect{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
#view.enter .chart .lc{stroke-dasharray:900;animation:draw 1.2s ease-out both}
@keyframes grow{from{transform:scaleY(.15)}to{transform:none}}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
.perf-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.perf-head p{margin:0;color:var(--muted);font-size:13px}
.delta{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:10px}
.delta.up{color:var(--lila);background:var(--lila-soft)} .delta.down{color:var(--danger);background:var(--danger-soft)} .delta.flat{color:var(--muted);background:var(--surface-2)}
.delta svg.i{width:18px;height:18px}
.prog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prog li{display:flex;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(180deg,#100E16,#0A090E);border:1px solid var(--line);border-radius:16px}
.prog .pb{flex:1;min-width:0}
.prog strong{display:block;font-weight:600}
.prog .ds{white-space:normal}
.prog .dv{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--lila);font-variant-numeric:tabular-nums;white-space:nowrap}
.spark{flex:none}
.spark polyline{fill:none;stroke:var(--lila);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:#fff}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.hist .hd{font-weight:600}
.hist .hl{font-size:14px;color:var(--muted)}
.empty{padding:18px 16px;border:1.5px dashed var(--line-2);border-radius:16px;color:var(--muted);margin-top:14px}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}

/* análisis */
.recs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.recs li{display:flex;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,#100E16,#0A090E)}
.recs .lv{width:8px;border-radius:4px;flex:none;background:var(--dim)}
.recs .alta .lv{background:var(--danger);box-shadow:0 0 10px rgba(255,163,200,.5)} .recs .media .lv{background:var(--lila)} .recs .ok .lv{background:#fff}
.recs strong{display:block;font-weight:600}
.recs p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.vol{display:flex;flex-direction:column;gap:7px;padding:14px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,#100E16,#0A090E)}
.vol-row{display:grid;grid-template-columns:92px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.vol-row>span:first-child{color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vol-row b{font-family:var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.vtrack{position:relative;height:12px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.vzone{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.07);border-left:1px dashed rgba(255,255,255,.25);border-right:1px dashed rgba(255,255,255,.25)}
.vbar{position:absolute;left:0;top:2px;bottom:2px;border-radius:4px;background:linear-gradient(90deg,var(--lila-deep),var(--lila))}
.vbar.low{background:var(--danger)} .vbar.high{background:linear-gradient(90deg,var(--lila),#fff)}
.vdone{position:absolute;top:0;bottom:0;width:3px;background:#fff;border-radius:2px;box-shadow:0 0 6px #fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.pp{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,#100E16,#0A090E)}
.pp-bar{display:flex;height:16px;border-radius:8px;overflow:hidden}
.pp-bar i{display:block;height:100%}
.pp-bar .pu{background:var(--lila)} .pp-bar .pl{background:#fff}
.pp-lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.pp-lbl b{color:var(--ink);font-family:var(--f-display)}
.zones{width:100%;border-collapse:collapse;font-size:14px}
.zones td{padding:9px 6px;border-bottom:1px solid var(--line)}
.zones td:last-child{text-align:right;font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;color:var(--lila-hi)}
.method{margin-top:18px;font-size:12px;color:var(--dim)}

#view.enter .anim{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{transform:perspective(900px) rotateX(16deg) translateY(18px);opacity:.3}to{transform:none;opacity:1}}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(0,0,0,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid #1A1822;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs::before{content:"";position:absolute;left:10%;right:10%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--lila-line),transparent)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:var(--tabh);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.02em;position:relative;transition:color .2s}
.tab svg.i{width:23px;height:23px;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.tab[aria-current="page"]{color:var(--lila)}
.tab[aria-current="page"] svg.i{transform:perspective(120px) translateY(-2px) rotateX(18deg);filter:drop-shadow(0 0 8px rgba(183,155,255,.7))}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:26%;right:26%;height:3px;border-radius:0 0 3px 3px;background:var(--lila);box-shadow:0 0 12px var(--lila)}

.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);z-index:26;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-radius:999px;background:#fff;color:#000;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 30px -8px var(--lila-glow);max-width:calc(100% - 32px);white-space:nowrap}
.rest .rl{font-size:14px;font-weight:700}
.rest b{font-family:var(--f-display);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;min-width:50px}
.rest button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #CFCBD9;font-size:14px;font-weight:700;color:inherit}
.rest.ring{background:var(--lila);color:var(--on-lila)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 72px);z-index:70;background:var(--surface-3);color:var(--ink);border:1px solid var(--lila-line);padding:10px 16px;border-radius:14px;font-size:15px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 24px -8px var(--lila-glow)}

#sheet-root{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:relative;width:100%;max-width:560px;margin:0 auto;max-height:90%;overflow:auto;overscroll-behavior:contain;background:#0C0B11;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .32s cubic-bezier(.2,.8,.2,1);transform-origin:50% 100%}
@keyframes up{from{transform:perspective(900px) rotateX(-12deg) translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);flex:none}
.sub{margin:6px 0 0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ed-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ed-list li{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.ed-list .en{flex:1;min-width:0}
.ed-list .en strong{display:block;font-weight:600;font-size:15px}
.ed-list .en small{color:var(--muted);font-size:13px}
.ed-list button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.sheet-actions .btn{flex:1}
.pick-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.add-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.add-run{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.add-run svg.i{width:18px;height:18px}
.lib-row>svg.i:last-child{color:var(--lila)}

/* NPC a pantalla completa al aplicar la rutina */
.npc-ov{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-stage{position:relative;flex:1 1 auto;min-height:260px;background:radial-gradient(90% 55% at 50% 100%,rgba(140,108,242,.3),rgba(0,0,0,0) 65%),#000;animation:ovIn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes ovIn{from{transform:perspective(900px) rotateX(24deg) scale(.86);opacity:0}to{transform:none;opacity:1}}
.ov-stage .stage-fallback{inset:20px 16px}
.ov-top{position:absolute;left:0;right:0;top:0;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));pointer-events:none;text-align:center;background:linear-gradient(180deg,#000 0%,rgba(0,0,0,.75) 55%,rgba(0,0,0,0) 100%)}
.ov-title{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.06em;background:linear-gradient(90deg,#fff,var(--lila-hi),var(--lila));-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.ov-hud{flex:none;width:100%;max-width:560px;margin:0 auto;padding-block:14px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;animation:rise .7s .25s cubic-bezier(.2,.8,.2,1) both}
.ov-now{margin:0;font-size:15px;color:var(--muted)}
.ov-now b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);text-transform:uppercase;letter-spacing:.04em;line-height:1.15}
.ov-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ov-week span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--muted);transition:all .3s}
.ov-week span b{font-family:var(--f-display);font-size:14px;color:var(--ink)}
.ov-week span.on{border-color:var(--lila);background:var(--lila-soft);color:var(--lila-hi);transform:translateY(-3px);box-shadow:0 8px 20px -10px var(--lila-glow)}


/* avatar y perfil */
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--on-lila);background:linear-gradient(145deg,#fff,var(--lila) 55%,var(--lila-deep));text-decoration:none;flex:none;box-shadow:0 0 14px -4px var(--lila-glow)}
.avatar.xl{width:84px;height:84px;font-size:38px;position:relative}
.avatar.xl::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px dashed var(--lila-line);animation:spin 14s linear infinite}
.avatar.xl span{display:block;animation:tilt 6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tilt{50%{transform:perspective(200px) rotateY(28deg)}}
.pf-head{display:flex;gap:18px;align-items:center;padding-block:20px 2px}
.pf-main{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.pf-main .eyebrow{margin:0}
.pf-main h1{font-size:30px;overflow-wrap:anywhere}
.pf-lvl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pf-lvl b{color:var(--lila);font-family:var(--f-display)}
.pf-main .lvlbar{margin-top:4px;height:8px}
.medal.sm{width:30px;height:30px;perspective:200px}
.medal.sm .coin .face{font-size:13px}
.medal.sm .coin .f1{transform:translateZ(3px)} .medal.sm .coin .f2{transform:rotateY(180deg) translateZ(3px)}
.pf-acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pf-acts svg.i{width:17px;height:17px}
.sk{position:relative;margin-top:16px;padding:20px 18px 18px;border-radius:24px;border:1px solid var(--line);background:radial-gradient(120% 90% at 0% 0%,rgba(183,155,255,.3),rgba(0,0,0,0) 55%),linear-gradient(160deg,#17121F,#060509 70%);overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;align-items:center}
.sk.hot{border-color:var(--lila-line);box-shadow:0 0 0 1px rgba(183,155,255,.15),0 30px 70px -30px var(--lila-glow)}
.sk.hot::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.09) 50%,transparent 65%);transform:translateX(-100%);animation:shine 4s ease-in-out infinite}
.sk .flame3d{width:84px;height:104px}
.sk .fl i{left:13px;top:26px;width:58px;height:58px}
.sk.cold .fl i{background:linear-gradient(225deg,#9A97A6,#3A3745);box-shadow:none;opacity:.6}
.sk-main{min-width:0}
.sk-main .eyebrow{margin:0}
.sk-num{font-family:var(--f-display);font-weight:700;font-size:72px;line-height:.95;font-variant-numeric:tabular-nums}
.sk.hot .sk-num{background:linear-gradient(180deg,#fff,var(--lila-hi) 40%,var(--lila));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(183,155,255,.45))}
.sk-unit{font-family:var(--f-display);font-size:22px;font-weight:600;margin-left:6px}
.sk-since{margin:2px 0 0;font-size:14px;color:var(--muted)}
.sk-badge{position:absolute;top:14px;right:14px;animation:badge 1.8s ease-in-out infinite}
@keyframes badge{50%{transform:scale(1.08);box-shadow:0 0 16px var(--lila-glow)}}
.sk-foot{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.sk-foot div{padding:10px;border-radius:14px;background:rgba(0,0,0,.45);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.sk-foot span{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sk-foot b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.sk-chain{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.sk-chain .chain{margin:0}
.sk-msg{grid-column:1/-1;margin:10px 0 0;font-size:14px;font-weight:600;color:var(--lila-hi)}
#seg-anchor{height:0}
.seg{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15;margin-top:18px;padding-block:8px;background:var(--bg);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg a{flex:none;padding:0 14px;display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-weight:700;font-size:14px;text-decoration:none;transition:background-color .2s,color .2s,transform .2s}
.seg a[aria-current="page"]{background:var(--lila);color:var(--on-lila);border-color:var(--lila);box-shadow:0 8px 22px -10px var(--lila-glow);transform:perspective(300px) translateZ(6px)}
.sub-head{margin-top:10px}
.sub-head .sec-sub{margin:6px 0 0}
#view.swap{animation:screenIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{transform:perspective(1200px) rotateY(-7deg) translateX(26px);opacity:.2}to{transform:none;opacity:1}}

/* esfuerzo 1-10 */
.eff-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--lila-soft);border:1px solid var(--lila-line)}
.eff-row .em{font-size:32px;line-height:1}
.eff-row>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.eff-row small{font-size:13px;color:var(--muted)}
.eff-row .chg{font-size:13px;font-weight:700;color:var(--lila)}
.eff-ask{animation:askPulse 1.8s ease-in-out infinite}
@keyframes askPulse{50%{box-shadow:0 0 0 6px rgba(183,155,255,.18),0 10px 28px -12px var(--lila-glow)}}
.rpe-for{margin:-6px 0 0;color:var(--muted);font-size:15px;font-weight:600}
.rpe-big{display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:4px;text-align:center}
.rpe-em{font-size:78px;line-height:1.08;display:block}
.rpe-em.pop{animation:emPop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes emPop{0%{transform:perspective(300px) rotateY(-100deg) scale(.5)}100%{transform:none}}
.rpe-val{font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.rpe-val small{font-size:16px;color:var(--muted);margin-left:2px}
.rpe-lbl{margin:0;color:var(--muted);font-size:14px}
.rpe-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rpe-b{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);transition:transform .15s,background-color .15s}
.rpe-b .em{font-size:25px;line-height:1.15}
.rpe-b .rn{font-family:var(--f-display);font-weight:700;font-size:15px}
.rpe-b.on{background:var(--lila);border-color:var(--lila);color:var(--on-lila);transform:perspective(300px) translateZ(12px) translateY(-2px);box-shadow:0 10px 24px -8px var(--lila-glow)}
.rpe-scale{height:6px;border-radius:3px;background:linear-gradient(90deg,#4A4756,var(--lila-deep),var(--lila),#fff)}
.rpe-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:-8px}
.btn:disabled{opacity:.4;cursor:default}
.chart .lc.eff{stroke:var(--lila-hi)} .chart .dot.eff{stroke:var(--lila-hi)} .chart .end.eff{fill:var(--lila-hi)}
.eff-now{font-family:var(--f-display);font-weight:700;font-size:18px;padding:4px 10px;border-radius:10px;background:var(--lila-soft);color:var(--lila-hi);white-space:nowrap}

/* inicio de sesión */
.login{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lg-stage{position:relative;flex:1 1 auto;min-height:290px;background:radial-gradient(80% 55% at 50% 100%,rgba(140,108,242,.35),rgba(0,0,0,0) 65%),#000;animation:ovIn 1s cubic-bezier(.2,.8,.2,1) both}
.lg-stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(180deg,rgba(0,0,0,0),#000);pointer-events:none}
.lg-stage .lg-fb{inset:0}
.logo.big{--h:46px;width:92px;height:92px;perspective:420px}
.logo.big .cube i{border-width:2px;box-shadow:0 0 14px rgba(183,155,255,.45)}
.lg-form{flex:none;width:100%;max-width:440px;margin:0 auto;padding-block:4px 26px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:rise .8s .2s cubic-bezier(.2,.8,.2,1) both}
.lg-form .eyebrow{margin:0;color:var(--lila-hi)}
.lg-brand{margin:-6px 0 0;font-family:var(--f-display);font-weight:700;font-size:52px;line-height:1;letter-spacing:.2em;text-transform:uppercase;background:linear-gradient(90deg,#fff,var(--lila-hi) 45%,var(--lila));-webkit-background-clip:text;background-clip:text;color:transparent}
.lg-form .lead{margin:0}
.lg-name{font-size:19px;padding:15px 16px;border-radius:14px}
.lg-go{min-height:54px;font-size:18px}
.login.out .lg-stage{animation:lgOut .6s cubic-bezier(.6,0,.4,1) both}
.login.out .lg-form{animation:fadeDown .4s ease-in both}
.login.out{animation:fadeAway .6s .05s ease-in both}
@keyframes lgOut{to{transform:perspective(900px) translateZ(240px) rotateX(-10deg);opacity:0}}
@keyframes fadeDown{to{transform:translateY(30px);opacity:0}}
@keyframes fadeAway{to{opacity:0}}
@media (max-width:380px){ .lg-brand{font-size:42px} .sk-num{font-size:58px} .rpe-em{font-size:64px} .rpe-b .em{font-size:22px} .avatar.xl{width:70px;height:70px;font-size:32px} }


html{overflow-x:hidden}
#view.slide-fwd,.sub-body.slide-fwd{animation:slideF .45s cubic-bezier(.2,.8,.2,1)}
#view.slide-back,.sub-body.slide-back{animation:slideB .45s cubic-bezier(.2,.8,.2,1)}
@keyframes slideF{from{transform:perspective(1200px) rotateY(-8deg) translateX(36px);opacity:.15}to{transform:none;opacity:1}}
@keyframes slideB{from{transform:perspective(1200px) rotateY(8deg) translateX(-36px);opacity:.15}to{transform:none;opacity:1}}
.icon-btn:disabled{opacity:.3;cursor:default}
/* avatar con foto */
.avatar{position:relative}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
img[data-ph]:not([src]){visibility:hidden}
/* llama que crece */
.sk{--fs:1}
.sk .flame3d{width:calc(84px*var(--fs));height:calc(104px*var(--fs));position:relative;transition:width .6s,height .6s}
.sk .fl i{left:calc(13px*var(--fs));top:calc(26px*var(--fs));width:calc(58px*var(--fs));height:calc(58px*var(--fs))}
.flame3d .core{position:absolute;left:50%;top:60%;width:calc(24px*var(--fs));height:calc(24px*var(--fs));margin:calc(-12px*var(--fs)) 0 0 calc(-12px*var(--fs));border-radius:50% 0 50% 50%;transform:rotate(-45deg);background:radial-gradient(circle at 40% 60%,#fff,var(--lila-hi));box-shadow:0 0 18px 4px rgba(255,255,255,.55);animation:core 1.3s ease-in-out infinite}
@keyframes core{50%{transform:rotate(-45deg) scale(1.18)}}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks s{position:absolute;bottom:20%;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px var(--lila);opacity:0;animation:spark 2.1s linear infinite;text-decoration:none}
.sparks s:nth-child(1){left:28%;animation-delay:0s}.sparks s:nth-child(2){left:62%;animation-delay:.5s}.sparks s:nth-child(3){left:45%;animation-delay:1s}.sparks s:nth-child(4){left:72%;animation-delay:1.4s}.sparks s:nth-child(5){left:36%;animation-delay:.25s}.sparks s:nth-child(6){left:55%;animation-delay:1.7s}.sparks s:nth-child(7){left:20%;animation-delay:.8s}.sparks s:nth-child(8){left:80%;animation-delay:1.2s}
@keyframes spark{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translate(6px,calc(-95px*var(--fs)));opacity:0}}
.sk.fm2 .fl i,.sk.fm3 .fl i,.sk.fm4 .fl i{background:linear-gradient(225deg,#fff 0%,#fff 16%,var(--lila-hi) 42%,var(--lila) 72%,var(--lila-deep) 100%)}
.sk.fm4 .fl i{box-shadow:0 0 30px var(--lila)}
.sk-grow{margin:8px 0 0;font-size:13px;color:var(--lila-hi);font-weight:600}
.sk-gbar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden;max-width:220px}
.sk-gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lila),#fff)}
/* cronómetro de descanso */
.sw{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.sw-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--lila);flex:none}
.sw-ic svg.i{width:19px;height:19px}
.sw.on{border-color:var(--lila-line)}
.sw.on .sw-ic{background:var(--lila);color:var(--on-lila);animation:swPulse 1s ease-in-out infinite}
@keyframes swPulse{50%{box-shadow:0 0 0 6px rgba(183,155,255,.16)}}
.sw-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.sw-k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sw-i{font-size:13px;color:var(--muted)} .sw-i b{color:var(--ink)}
.sw-t{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.sw small{color:var(--muted);font-size:14px}
.sw.ring{background:var(--lila-soft);border-color:var(--lila)} .sw.ring .sw-t{color:var(--lila-hi)}
.sw-sum{margin:0;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)} .sw-sum b{color:var(--ink)} .sw-sum svg.i{width:16px;height:16px;color:var(--lila)}
.fin-btn svg.i,.fin-day svg.i{width:18px;height:18px}
.rest svg.i{width:18px;height:18px}
.rest .rest-g{font-size:13px;color:#6F6B7D;margin-left:-4px}
.rest .rest-go{background:#000;color:#fff;border-color:#000}
.rest.ring .rest-g{color:var(--on-lila)} .rest.ring .rest-go{background:var(--on-lila);border-color:var(--on-lila)}
/* finalizar y resumen */
.finish{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.fin-day{min-height:54px;font-size:17px}
.is-off{opacity:.5}
.done-card{margin-top:16px;padding:16px;display:flex;flex-direction:column;gap:12px;border-color:var(--lila-line);background:linear-gradient(160deg,#1A1428,#09080D 60%)}
.dc-head{display:flex;gap:12px;align-items:center}
.dc-head>svg.i{width:42px;height:42px;padding:9px;border-radius:50%;background:var(--lila);color:var(--on-lila);box-sizing:border-box;stroke-width:2.6;animation:emPop .6s cubic-bezier(.2,1.6,.4,1)}
.dc-head .eyebrow{margin:0}
.fin-photo{display:flex;flex-direction:column;gap:8px}
.fin-photo img{width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover;border-radius:14px}
/* actividades */
.acts{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.act{padding:16px;display:flex;flex-direction:column;gap:12px}
.act-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.act-h>div{min-width:0}
.act-h .eyebrow{margin:0}
.act-h h3{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:.02em}
.act-ph{border-radius:16px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--surface-2)}
.act-ph img{width:100%;height:100%;object-fit:cover;display:block;animation:phIn .6s ease-out}
@keyframes phIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.act-ex{list-style:none;margin:0;padding:0;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.act-ex b{color:var(--ink);font-weight:600}
.act-note{margin:0;font-size:15px;font-style:italic}
/* calendario */
.cal{padding:14px;margin-top:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-head h3{font-family:var(--f-display);font-size:19px;text-transform:uppercase;letter-spacing:.06em;text-align:center}

.cd.empty{border:0;background:none}

.cdots{display:flex;gap:2px;height:5px}
.cdots i{width:5px;height:5px;border-radius:50%}
.cdots .g{background:var(--lila)} .cd.tr .cdots .g{background:var(--on-lila)}
.cdots .r{background:#fff}
.cdots .p{border-radius:1px;background:var(--lila-hi)} .cd.tr .cdots .p{background:#fff}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:12px}

.lg-tr{background:var(--lila)} .lg-g{background:var(--lila);border-radius:50%!important} .lg-r{background:#fff;border-radius:50%!important} .lg-p{background:var(--lila-hi)} .lg-m{border:1px dashed var(--dim)}
/* km */

.hb-r>span:first-child{color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;border-radius:6px;background:var(--surface-3);overflow:hidden}

.hb-r b{font-family:var(--f-display);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .td{font-size:12px;font-weight:700;margin-top:2px} .td.up{color:var(--lila)} .td.down{color:var(--danger)}

.day-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}

.macro-card{padding:16px;display:flex;gap:14px;align-items:center;margin-top:14px}
.ring{width:118px;height:118px;flex:none}
.ring .rb{fill:none;stroke:var(--surface-3);stroke-width:10}
.ring .rf{fill:none;stroke:var(--lila);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(183,155,255,.6));transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
.ring .rf.over{stroke:var(--danger)}
.ring .rv{fill:var(--ink);font-family:var(--f-display);font-size:24px;font-weight:700;text-anchor:middle}
.ring .rl{fill:var(--muted);font-size:9px;text-anchor:middle;font-family:var(--f-body)}
.mbars{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.mb-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}

.mb-track{position:relative;height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden;margin-top:4px}
.mb-zone{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.08);border-left:1px dashed rgba(255,255,255,.3);border-right:1px dashed rgba(255,255,255,.3)}
.mb-fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:3px;background:linear-gradient(90deg,var(--lila-deep),var(--lila))}
.mb-low .mb-fill,.mb-high .mb-fill{background:var(--danger)}
.mb-msg{margin:4px 0 0;font-size:12px;color:var(--muted)}
.mb-low .mb-msg,.mb-high .mb-msg{color:var(--danger)} .mb-ok .mb-msg{color:var(--lila-hi)}
.food-alert{margin:12px 0 0;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--danger-soft);border:1px solid rgba(255,163,200,.35);color:var(--danger);font-size:14px;font-weight:600}
.food-alert.good{background:var(--lila-soft);border-color:var(--lila-line);color:var(--lila-hi)}
.food-alert svg.i{width:18px;height:18px;margin-top:1px}
.add-food,.setup{padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:14px}
.setup p{margin:0;color:var(--muted);font-size:14px}
.meal-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.meal-chips::-webkit-scrollbar{display:none}
.mchip-b{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:700;font-size:13px;transition:transform .15s}
.mchip-b.on{background:var(--lila);color:var(--on-lila);border-color:var(--lila);transform:perspective(200px) translateZ(6px)}
.food-res{display:flex;flex-direction:column;gap:6px}
.fr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.fr>span{flex:1;min-width:0;display:flex;flex-direction:column}
.fr small{font-size:12px;color:var(--muted)}
.fr b{font-family:var(--f-display);font-size:15px;white-space:nowrap}
.fr svg.i{color:var(--lila);width:18px;height:18px}
.meal{margin-top:10px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#100E16,#0A090E);overflow:hidden}
.meal-h{display:flex;justify-content:space-between;padding:10px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.meal-h b{color:var(--ink);font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em}
.meal ul{list-style:none;margin:0;padding:0}
.fi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.meal li:last-child .fi{border-bottom:0}
.fi-n{font-weight:600;overflow-wrap:anywhere}
.fi-m{grid-column:1;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fi b{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.week-food{padding:16px;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.week-food .sec-head{margin:0}
.week-food .pbar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.week-food .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lila-deep),var(--lila));box-shadow:0 0 10px var(--lila-glow)}
.fw-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.fw-d{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:10px;border:1px solid var(--line);font-family:var(--f-display);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.fw-d i{font-style:normal;font-size:11px;color:var(--dim);font-family:var(--f-body)}
.fw-d.good{background:var(--lila);color:var(--on-lila);border-color:var(--lila)} .fw-d.good i{color:var(--on-lila)}
.fw-d.mid{border-color:var(--lila);color:var(--lila-hi)}
.fw-d.bad{border-color:var(--danger);color:var(--danger)}
.fw-d.tr{background:linear-gradient(160deg,#fff,var(--lila-hi));color:var(--on-lila);border-color:#fff} .fw-d.tr i{color:var(--on-lila)}
.fw-d.today{outline:2px solid #fff;outline-offset:1px}
.treat-pick{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;border:1px dashed var(--lila);background:var(--lila-soft)}
.treat-pick p{margin:0}
.treat-ok{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:linear-gradient(120deg,rgba(183,155,255,.3),rgba(91,66,184,.15));border:1px solid var(--lila-line)}
.treat-ok>div{flex:1;display:flex;flex-direction:column;min-width:0}
.treat-ok span{font-size:13px;color:var(--muted)}
.treat-ok svg.i{color:var(--lila-hi)}
.treat-day{margin-top:12px;padding:14px 16px;border-radius:18px;background:linear-gradient(120deg,#fff,var(--lila-hi) 40%,var(--lila));color:var(--on-lila);animation:emPop .7s cubic-bezier(.2,1.4,.4,1)}
.treat-day p{margin:4px 0 0;font-size:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}


/* series guiadas */
.tgt{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.015)}
.tgt-k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rest-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.rest-row b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.rr-btns{display:flex;gap:6px}
.step-btn.sm{width:auto;min-width:48px;height:38px;padding:0 8px;font-family:var(--f-display);font-weight:700;font-size:14px}
.setlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.set-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
.set-row .sn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:700;border:2px solid var(--line-2)}
.set-row.done{background:var(--lila-soft);border-color:var(--lila-line)}
.set-row.done .sn{background:var(--lila);border-color:var(--lila);color:var(--on-lila)}
.set-row.done .sn svg.i{width:18px;height:18px;stroke-width:2.8}
.set-row.flip .sn{animation:flip .55s cubic-bezier(.2,.8,.2,1)}
.set-row.todo{opacity:.55}
.sr-t{flex:1;min-width:0;display:flex;flex-direction:column}
.sr-t b{font-weight:700;font-size:15px}
.sr-t span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.set-row.done .sr-t span{color:var(--lila-hi);font-weight:600}
.sr-rest{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.set-row.live .sr-t span{color:var(--lila-hi);font-weight:700}
.sr-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sr-done{min-height:50px}

.rbar{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--surface);border:1px dashed var(--lila-line)}

.rbar-track{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.rbar-track i{display:block;height:100%;background:linear-gradient(90deg,var(--lila),#fff);transition:width .25s linear}
.rbar-btns{display:flex;gap:6px}
.rbar-btns .btn{flex:1;padding:0 6px}
.rest .rest-tx{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.rest .rest-tx small{font-size:11px;font-weight:600;color:#6F6B7D;white-space:nowrap}
.rest.ring .rest-tx small{color:var(--on-lila)}
.wm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.wm-h{width:100%;font-size:12px;color:var(--dim)}

function bodyMap(mv,labels){ const M0=MOV[mv]||MOV.idle; return bodyMapPS(M0.P,M0.S,labels) }
function bodyMapPS(P,Sx,labels){
  const M={P:P||[], S:Sx||[]};
  const cls=id=>M.P.includes(id)? 'm-p' : M.S.includes(id)? 'm-s' : 'm-n';
  const sil=SIL.map(([s,tag,a])=>sym(svgEl(tag,a,'sil'),s)).join('');
  let f='', b='';

  return '<svg class="bodymap" viewBox="0 0 200 '+(labels?212:200)+'" role="img" aria-label="Músculos que trabajas: '+esc(names)+'"><g>'+sil+f+'</g><g transform="translate(100 0)">'+sil+b+'</g>'

function applyRoutine(s,spec,opts){
  opts=opts||{};
  s.prevPlan={exercises:clone(s.exercises), days:clone(s.days), calib:s.calib||null};
  const byName={}; for(const id in s.exercises) byName[slug(s.exercises[id].name)]=id;
  const newEx={}, days={};
  const logged=new Set(); for(const k in s.log.days){ const L=s.log.days[k]; for(const lid in (L.ex||{})) logged.add(lid) }
  for(let d=0; d<7; d++){
    const sd=spec.days[d]||{}, ids=[];
    (sd.ex||[]).forEach(x=>{
      const key=slug(x.name); let id=byName[key];
      const mv=MOV[x.mv]? x.mv : guessMove(x.name);
      if(id&&s.exercises[id]&&(!opts.fresh||logged.has(id))){
        const ex=s.exercises[id]; ex.mv=mv; if(x.sets) ex.sets=x.sets; if(x.reps) ex.reps=x.reps; if(x.w>0) ex.w=x.w; newEx[id]=ex;
      } else {
        id=key; let n=2; while(newEx[id]||(s.exercises[id]&&slug(s.exercises[id].name)!==key)) id=key+'-'+(n++);
        const comp=COMPOUND.includes(mv);
        const prog=x.prog||((mv==='pullup'||mv==='dips')&&!/jalon/.test(normTxt(x.name))&&!(x.w>0)? 'reps' : 'kg');
        newEx[id]={name:x.name, sets:x.sets||(comp?4:3), reps:x.reps||(comp?8:12), w:x.w||0, step:x.step||(prog==='reps'?1:(/mancuern/.test(normTxt(x.name))? (comp?2:1) : (mv==='lateral'?1:2.5))), bar:!!x.bar, prog, mv, cal:true};
        byName[key]=id;
      }
      if(!ids.includes(id)) ids.push(id);
    });
    days[d]={title:sd.title||'', ex:ids, run:sd.run? {kind:sd.run.kind||'Rodaje', km:sd.run.km>0? sd.run.km : 5, step:sd.run.step!=null? sd.run.step : 0.5, pace:sd.run.pace||0, cal:true} : null};
  }
  for(const id in s.exercises){ if(!newEx[id]&&logged.has(id)) newEx[id]=s.exercises[id] }
  s.exercises=newEx; s.days=days;
  const t=todayKey(); s.calib={start:t, end:addDays(t,6), seen:false};
  s.introDone=true;
}
function dayTitleFrom(ex,run){
  if(!ex.length) return run? (run.kind||'Carrera') : 'Descanso';
  const cnt={}; ex.forEach(x=>{ (MOV[x.mv]||MOV.idle).P.forEach(m=>{ cnt[m]=(cnt[m]||0)+1 }) });
  const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,3).map(m=>MUS[m].toLowerCase());
  const t=top.length? cap(listEs(top)) : 'Gym';
  return run? t+' + carrera' : t;
}
function parseRoutine(txt){
  const map={lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6,domingo:0};
  const re=/(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)/gi;
  const marks=[]; let m;
  while((m=re.exec(txt))) marks.push({d:map[normTxt(m[1])], i:m.index, end:m.index+m[0].length});
  const days={};
  marks.forEach((mk,j)=>{ days[mk.d]=parseDay(txt.slice(mk.end, j+1<marks.length? marks[j+1].i : txt.length)) });
  return days;
}
function parseDay(body){
  let b=' '+body.replace(/^[\s:\-–—.]+/,'')+' ';
  const nb=normTxt(b);
  const noRun=/no\s+corr|sin\s+correr/.test(nb);
  const kmM=nb.match(/(\d+(?:[.,]\d+)?)\s*(km|kilometro)/);
  let run=null;
  if(!noRun&&/corr|rodaje|carrera|running|tirada|trote|series en pista/.test(nb)){
    const kind=/tirada|larga/.test(nb)? 'Tirada larga' : /series/.test(nb)? 'Series' : /tempo/.test(nb)? 'Tempo' : 'Rodaje';
    run={kind, km:kmM? num(kmM[1]) : 0};
  }
  b=b.replace(/(^|[\s,;])(y\s+)?(no\s+corr\w*|sin\s+correr|solo\s+corr\w*|corr\w*|rodaje|tirada larga|tirada|carrera|trote)[^,;\n]*/gi,' ');
  b=b.replace(/\b(descanso|libre|nada|solo)\b/gi,' ');
  const parts=b.split(/[,;\n]|\s+y\s+|\s+\+\s+/i).map(x=>x.trim().replace(/^(y|e)\s+/i,'').replace(/[.]+$/,'').trim()).filter(x=>x.length>=3);
  const ex=parts.map(p=>{
    let sets=0, reps=0, w=0;
    let sr=p.match(/(\d+)\s*[x×*]\s*(\d+)/i)||p.match(/(\d+)\s*series?\s*(?:de|x)\s*(\d+)/i);
    if(sr){ sets=+sr[1]; reps=+sr[2]; p=p.replace(sr[0],' ') }
    const kg=p.match(/(\d+(?:[.,]\d+)?)\s*kg/i); if(kg){ w=num(kg[1]); p=p.replace(kg[0],' ') }
    p=p.replace(/\s*(repeticiones|reps?)\b/gi,' ');
    const name=cap(p.replace(/\s+/g,' ').trim());
    const mv=guessMove(name);
    return {name, sets:Math.min(12,sets), reps:Math.min(100,reps), w, mv};
  }).filter(x=>x.name.length>=3);
  return {ex, run};
}
function routineToText(){
  return WEEK.map(d=>{ const p=S.days[d], ex=p.ex.filter(id=>S.exercises[id]).map(id=>S.exercises[id].name); let t=DOW_LONG[d]+': ';
    if(!ex.length&&!p.run) return t+'descanso';
    t+=ex.join(', '); if(p.run) t+=(ex.length? ' y ' : '')+'corro '+fmtKm(p.run.km)+' km'; return t }).join('\n');
}

function normalize(s){

    e.w=Math.max(0, round2(+e.w||0));
    e.step=(+e.step>0)? round2(+e.step) : (e.prog==='reps'?1:2.5);
    e.bar=!!e.bar; e.cal=!!e.cal; e.rest=(+e.rest>=15&&+e.rest<=600)? Math.round(+e.rest) : 0; e.wm=(e.wm==='lado'||e.wm==='total')? e.wm : (/mancuern/.test(normTxt(e.name))? 'lado' : 'total');
    if(!MOV[e.mv]||e.mv==='run') e.mv=guessMove(e.name);
  }
  const days=s.days||{}; s.days={};
  for(let i=0;i<7;i++){
    const x=days[i]||{};
    s.days[i]={
      title:String(x.title||''),
      ex:Array.isArray(x.ex)? x.ex.filter(id=>s.exercises[id]) : [],
      run:(x.run&&+x.run.km>0)? {kind:String(x.run.kind||'Rodaje'), km:round2(+x.run.km), step:Math.max(0, round2(+x.run.step||0)), pace:(+x.run.pace>0)? round2(+x.run.pace) : 0, cal:!!x.run.cal} : null
    };
  }
  s.log=s.log||{}; s.log.days=s.log.days||{}; s.log.claims=s.log.claims||{}; s.log.counters=s.log.counters||{};
  s.custom=Array.isArray(s.custom)? s.custom.filter(c=>c&&c.id&&c.title) : [];

  for(const k in s.log.days){ if(k<cutoff) delete s.log.days[k] }
  if(s.routineApplied!=='r1') s.routineApplied='r1';
  return s;
}

let mode='loading', dbNS=null, uidV=null, unsubs=[], timer=null, sync='connecting';
const DOCS={app:{dirty:false, writing:false, retried:false, ref:null, firm:false}, food:{dirty:false, writing:false, retried:false, ref:null, firm:false}};
const SYNC_TXT={connecting:'Conectando…', saving:'Guardando…', saved:'Guardado en tu cuenta', local:'Guardado en este dispositivo', offline:'Sin conexión · guardado en el móvil'};
function setSync(s){ sync=s; const el=document.getElementById('sync'); if(el){ el.dataset.s=s; el.textContent=SYNC_TXT[s]||'' } }
function bodyOf(n){ if(n==='food') return clone(S.food); const o=Object.assign({},S); delete o.food; return clone(o) }

function schedule(){ clearTimeout(timer); setSync('saving'); timer=setTimeout(()=>{ flush('app'); flush('food') },600) }
function updSync(){ if(mode!=='db') return; const busy=DOCS.app.dirty||DOCS.app.writing||DOCS.food.dirty||DOCS.food.writing; setSync(busy? 'saving' : DOCS.app.firm? 'saved' : 'connecting') }
async function flush(n){
  const D=DOCS[n]; if(mode!=='db'||!D.ref||D.writing) return;
  if(!D.dirty){ updSync(); return }
  D.writing=true; D.dirty=false;
  let body; try{ body=bodyOf(n) }catch(e){ D.writing=false; return }
  try{ await D.ref.set(body); D.retried=false }
  catch(err){
    const c=err&&err.code; D.writing=false;
    if(c==='unavailable'){ D.dirty=true; setSync('offline'); clearTimeout(D.rt); D.rt=setTimeout(()=>flush(n), D.retried? 20000 : 2500); D.retried=true; return }
    if(c==='quota_exceeded'||(c==='invalid_argument'&&JSON.stringify(body).length>240000)){ D.dirty=true; toast('Tu espacio está lleno. Borra el historial en Perfil › Ajustes para seguir guardando.'); setSync('offline'); return }
    goLocal('Tu cuenta no permite guardar aquí. Los cambios se guardan en este dispositivo.'); return;
  }

}
function goLocal(msg){

function foodHasData(){ return Object.keys(S.food.days).length>0||Object.keys(S.food.treats).length>0 }
function docErr(error){ const m=String((error&&error.message)||error||''); return {code:((error&&(error.code==='42501'||error.code==='PGRST301'))||/jwt|not authorized|permission|row-level/i.test(m))? 'denied' : 'unavailable', message:m} }
function makeDb(uid){
  const ref=id=>{
    const r={
      async set(data){ let res; try{ res=await sb.from('docs').upsert({user_id:uid, id, data, updated_at:new Date().toISOString()}) }catch(e){ throw docErr(e) } if(res&&res.error) throw docErr(res.error) },
      async get(){ let res; try{ res=await sb.from('docs').select('data').eq('user_id',uid).eq('id',id).maybeSingle() }catch(e){ throw docErr(e) } if(res.error) throw docErr(res.error); const d=res.data&&res.data.data; return {id, exists:!!d, data:()=>d||undefined, metadata:{fromCache:false, hasPendingWrites:false}} },
      async delete(){ try{ await sb.from('docs').delete().eq('user_id',uid).eq('id',id) }catch(e){} },
      onSnapshot(next,error){
        let alive=true;
        const pull=()=>r.get().then(sn=>{ if(alive) next(sn) }).catch(e=>{ if(!alive) return; if(e.code==='denied'){ alive=false; if(error) error(e) } else setSync('offline') });
        pull();
        const onVis=()=>{ if(document.visibilityState==='visible') pull() };
        document.addEventListener('visibilitychange',onVis); window.addEventListener('online',pull);
        return ()=>{ alive=false; document.removeEventListener('visibilitychange',onVis); window.removeEventListener('online',pull) };
      }
    };
    return r;
  };
  return {collection:()=>({doc:ref})};
}

function compressImage(file,max,square){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ try{
      let sw2=img.naturalWidth, sh=img.naturalHeight, sx=0, sy=0;
      if(square){ const m=Math.min(sw2,sh); sx=(sw2-m)/2; sy=(sh-m)/2; sw2=sh=m }
      const sc=Math.min(1,max/Math.max(sw2,sh)); let w=Math.max(1,Math.round(sw2*sc)), h=Math.max(1,Math.round(sh*sc)), q=0.8, d='';
      const c=document.createElement('canvas');
      for(let i=0;i<6;i++){ c.width=w; c.height=h; const g=c.getContext('2d'); g.fillStyle='#000'; g.fillRect(0,0,w,h); g.drawImage(img,sx,sy,sw2,sh,0,0,w,h); d=c.toDataURL('image/jpeg',q); if(d.length<200000) break; q=Math.max(0.5,q-0.1); w=Math.round(w*0.85); h=Math.round(h*0.85) }
      URL.revokeObjectURL(url); res(d);
    }catch(e){ URL.revokeObjectURL(url); rej(e) } };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('img')) };
    img.src=url;
  });
}

  for(const id in ex){ const e=ex[id]; (e.done||[]).forEach((d,j)=>{ if(!d) return; sets++; const lg=e.log&&e.log[j]; vol+=(lg? lg.r : (e.reps||0))*effW(S.exercises[id],(lg&&lg.w!=null)? lg.w : (e.w||0)) }); if(e.up) ups++ }

function planTotals(){

function avgPace(k,days){

function firstLogKey(){ const keys=Object.keys(S.log.days).filter(k=>logStats(S.log.days[k]).trained).sort(); return keys[0]||null }
function streakInfo(){
  const f=firstLogKey(), t=todayKey(), Lt=S.log.days[t];
  const base={todayDone:!!(Lt&&logStats(Lt).trained), todayPlanned:hasContent(planFor(t))};
  if(!f) return Object.assign({n:0, since:null, best:0}, base);
  let k=t, n=0, since=null;
  for(let i=0;i<400&&k>=f;i++){ const L=S.log.days[k], tr=L&&logStats(L).trained; if(tr){ n++; since=k } else if(hasContent(planFor(k))&&i>0) break; k=addDays(k,-1) }

}
function streak(){ return streakInfo().n }
function weekGoal(){ return Math.max(1, Math.ceil(planTotals().days*0.7)) }

function calibInfo(){
