function isDb(ex){ return /mancuern/.test(normTxt(ex&&ex.name)) }
function sideWord(ex){ return isDb(ex)? 'por mancuerna' : 'por lado' }
function wLabel(ex){ return ex&&ex.wm==='lado'? sideWord(ex) : 'total' }
function effW(ex,w){ w=+w||0; if(!ex||ex.wm!=='lado') return w; return w*2+(ex.bar? 20 : 0) }
function kgTxt(ex,w){ return fmtKg(w)+' kg'+(ex&&ex.wm==='lado'? ' '+sideWord(ex) : '') }

function lastSessionStruggled(id,k){

  for(const d of keys){ const e=S.log.days[d].ex&&S.log.days[d].ex[id]; if(e&&e.done.some(Boolean)) return rateOf(e)==='hard'||!e.done.every(Boolean) }

/* progresión de cada ejercicio: doble progresión ajustada por cómo te ha costado (reps en reserva) */
function syncExercise(id,k){
  const ex=S.exercises[id], e=S.log.days[k].ex[id]; if(!ex||!e) return '';
  const isR=ex.prog==='reps';
  const complete=e.done.length>0&&e.done.every(Boolean);
  ex.sets=e.done.length; e.deload=false;
  if(!complete||!S.settings.autoUp||(!isR&&!(e.w>0))){ ex.w=e.w; ex.reps=e.reps; e.up=false; return '' }
  const rate=rateOf(e)||'ok', short=!!(e.log&&e.log.some((l,j)=>e.done[j]&&l&&l.r<e.reps)), mult=short? 0 : rate==='easy'? 2 : rate==='ok'? 1 : 0; e.short=short;
  let msg='';
  if(rate==='hard'&&lastSessionStruggled(id,k)){
    e.deload=true; e.up=false;
    if(isR){ ex.w=e.w; ex.reps=Math.max(1,e.reps-2) } else { ex.reps=e.reps; ex.w=floorStep(e.w*0.9,ex.step) }
    msg='Dos sesiones seguidas al límite: bajamos un poco para que recuperes';
  } else if(isR){ ex.w=e.w; ex.reps=clampInt(e.reps+mult*ex.step,1,100,e.reps); e.up=mult>0 }
  else { ex.reps=e.reps; ex.w=round2(e.w+mult*ex.step); e.up=mult>0 }
  if(rpeOf(e)&&ex.cal){ ex.cal=false; if(!msg) msg='Calibrado: '+ex.name }
  if(rpeOf(e)&&!(ex.base>0)) ex.base=round2(metricOf(ex,e));
  return msg;
}
/* progresión de la carrera: kilómetros y ritmo */
function applyRunProgress(k){
  const p=planFor(k), L=S.log.days[k], r=L&&L.run; if(!r) return '';
  const dp=S.days[p.dow].run, pace=(r.min&&r.km)? r.min/r.km : 0, rate=runRateOf(r)||'ok';
  if(!dp||!(r.target>0)){
    if(pace&&r.km>=1.5&&(!S.runBase||(S.runBase.free&&S.runBase.from===k))){
      const base=round2(pace+(rate==='hard'?0.25:rate==='easy'?-0.08:0));
      S.runBase={pace:base, from:k, free:true};
      for(let d=0;d<7;d++){ const x=S.days[d].run; if(x&&!x.pace) x.pace=round2(base+(PACE_OFF[x.kind]||0)) }
      return 'Carrera guardada. Ritmo base calculado: '+fmtPace(base)+' /km';
    }
    return 'Carrera guardada';
  }
  if(dp.cal||r.calib){
    r.calib=true; dp.cal=false; r.up=false;
    dp.km=Math.max(0.5,roundTo(r.km,0.5));
    if(pace){
      const base=round2(pace+(rate==='hard'?0.25:rate==='easy'?-0.08:0));
      if(!S.runBase||S.runBase.from===k||S.runBase.free){
        S.runBase={pace:base, from:k};
        for(let d=0;d<7;d++){ const x=S.days[d].run; if(x&&(x===dp||!x.pace)) x.pace=round2(base+(PACE_OFF[x.kind]||0)) }
      } else if(!dp.pace) dp.pace=round2(S.runBase.pace+(PACE_OFF[dp.kind]||0));
    }
    return 'Calibrado: tu objetivo será '+fmtKm(dp.km)+' km'+(dp.pace? ' a '+fmtPace(dp.pace)+' /km' : '');
  }
  const mult=rate==='easy'? 2 : rate==='ok'? 1 : 0;
  if(S.settings.autoUp&&r.km>=r.target){ dp.km=round2(r.target+mult*(dp.step||0)); r.up=mult>0&&dp.step>0 } else { dp.km=r.target; r.up=false }
  if(r.tpace>0){ dp.pace=(S.settings.autoUp&&pace&&pace<=r.tpace&&rate!=='hard')? round2(r.tpace-0.05) : r.tpace }
  if(r.up) return '¡Objetivo cumplido! Próxima vez: '+fmtKm(dp.km)+' km';
  return 'Carrera guardada';
}
function revertRun(k){
  const p=planFor(k), L=S.log.days[k], r=L&&L.run; if(!r) return;
  const dp=S.days[p.dow].run;
  if(S.runBase&&S.runBase.free&&S.runBase.from===k) delete S.runBase;
  if(dp&&r.target>0){ dp.km=r.target; if(r.tpace) dp.pace=r.tpace; if(r.calib){ dp.cal=true; if(S.runBase&&S.runBase.from===k) delete S.runBase } }
}

function plateSvg(total){
  const BAR=20;
  if(!(total>0)) return '';
  if(total<BAR) return '<div class="plates-wrap"><span class="plates-txt">Menos que la barra de 20 kg</span></div>';
  let side=round2((total-BAR)/2);
  const defs=[[25,'p25',44,9],[20,'p20',44,8],[15,'p15',44,7],[10,'p10',44,6],[5,'p5',28,5],[2.5,'p2',22,4],[1.25,'p1',18,3]];
  const used=[];
  defs.forEach(([kg,cls,h,w])=>{ while(side>=kg-1e-6&&used.length<14){ used.push({kg,cls,h,w}); side=round2(side-kg) } });
  let x=20, rects='';
  used.forEach(p=>{ rects+='<rect class="'+p.cls+'" x="'+x+'" y="'+(24-p.h/2)+'" width="'+p.w+'" height="'+p.h+'" rx="1.5"/>'; x+=p.w+1.5 });
  const end=x+10, W=Math.max(end,56);
  const label=used.length? used.map(p=>fmtKg(p.kg)).join(' + ') : 'solo la barra';

    +'</svg><span class="plates-txt">Por lado: '+label+rem+'</span></div>';
}

function weekStrip(k){
  const mon=mondayOf(k); let h='<ol class="week anim" style="--i:3" aria-label="Tu semana">';
  for(let i=0;i<7;i++){
    const d=addDays(mon,i), dt=parseKey(d), L=S.log.days[d], tr=L&&logStats(L).trained, planned=hasContent(planFor(d));
    let cls=tr? 'done' : !planned? 'off' : d<k? 'miss' : 'todo';
    if(d===k) cls+=' today';
    const st=tr? 'entrenado' : !planned? 'descanso' : d<k? 'sin hacer' : 'pendiente';
    h+='<li class="'+cls+'"><span class="wd">'+DOW_LETTER[dt.getDay()]+'</span><span class="dot" aria-label="'+DOW_LONG[dt.getDay()]+' '+dt.getDate()+': '+st+'">'+(tr? ICON.check : dt.getDate())+'</span></li>';
  }
  return h+'</ol>';
}
function calibHtml(){

function stageItems(p,showRun){ const items=p.ex.map(id=>'ex:'+id); if(showRun) items.push('run'); return items }
function itemInfo(item,p){
  if(item==='run'){ const r=p.run; return {name:r? r.kind : 'Carrera libre', mv:'run'} }
  const ex=S.exercises[item.slice(3)]; return ex? {name:ex.name, mv:ex.mv} : {name:'Ejercicio', mv:'idle'};
}
function stageCurrent(k,items){
  if(ui.stagePinned&&items.includes(ui.stage)) return ui.stage;
  const L=S.log.days[k]||{};
  for(const it of items){
    if(it==='run'){ if(!L.run) return it; continue }
    const e=L.ex&&L.ex[it.slice(3)]; if(!e||!e.done.every(Boolean)) return it;
  }
  return items[0]||null;
}
function stageHtml(k,p,showRun){

  const M=MOV[info.mv]||MOV.idle;

  const idx=items.indexOf(cur);
  const chips=M.P.map(id=>'<span class="mchip p">'+MUS[id]+'</span>').join('')+(M.S.length? '<span class="mchip s">+'+M.S.length+' más</span>' : '');

}
function musRow(mv,item){

function renderExCard(id,k,i){

    : '<input class="big-in" id="w-'+sid+'" data-f="w" data-ex="'+sid+'" inputmode="decimal" value="'+fmtKg(w)+'" aria-label="Peso objetivo en kilos, '+wLabel(ex)+'"><span class="unit">kg<small class="wm-u">'+wLabel(ex)+'</small></span>';

  let foot='';

  else if(complete&&e&&e.up) foot='<p class="next is-up">'+ICON.up+'<span>Próxima vez: <b>'+unitTxt(nextVal)+'</b>'+(rateOf(e)==='easy'? ' (te sobraba, subimos el doble)' : '')+'</span></p>';

  const rs=(e&&e.rests)||[];
  return '<article class="card ex anim'+(complete?' complete':'')+'" style="--i:'+i+'" data-exc="'+sid+'">'
    +'<header class="ex-head"><div><h3>'+esc(ex.name)+'</h3><p class="meta">'+(isR? sets+' series · '+(w>0? '+'+fmtKg(w)+' kg de lastre' : 'peso corporal') : sets+' series × '+reps+' repeticiones')+'</p></div><div class="ex-side"><span class="count">'+n+'/'+sets+'</span>'+(L&&L.extra&&L.extra.includes(id)? '<span class="tag lila">Extra</span>'+(n? '' : '<button class="del-x" data-act="extra-rm" data-ex="'+sid+'">Quitar</button>') : '')+(complete? '<span class="tag solid">Finalizado</span>' : ex.cal? '<span class="tag lila">Calibrando</span>' : '')+'</div></header>'

function runRate(r){ return effRow(rpeOf(r),'data-run="1"','run') }
function renderRunCard(k,p,i){

  if(target>0) body+='<div class="run-target"><span class="num">'+fmtKm(target)+'</span><span class="unit">km</span>'+(tpace? '<span class="pace-t">a '+fmtPace(tpace)+' /km</span>' : '')+'<span class="lbl">objetivo de hoy</span></div>';

      +'</div><p class="pace" id="run-pace">Ritmo: —</p><p class="err" id="run-err" hidden></p>'
      +'<div class="row-actions"><button class="btn run" style="flex:1" data-act="save-run">Guardar carrera</button>'+(r? '<button class="btn ghost" data-act="cancel-run">Cancelar</button>' : (!planned? '<button class="btn ghost" data-act="cancel-free">Quitar</button>' : ''))+'</div>'
      +'<div class="row-actions">'+importBtn('Importar de Garmin (.gpx / .tcx)')+'</div>';
  }
  let foot='';

  else if(r&&r.up&&dp) foot='<p class="next is-up">'+ICON.up+'<span>Próxima vez: <b>'+fmtKm(dp.km)+' km'+(dp.pace? ' a '+fmtPace(dp.pace)+' /km' : '')+'</b></span></p>';
  else if(!r&&planned&&!planned.cal&&S.settings.autoUp&&planned.step>0) foot='<p class="next">Llega a '+fmtKm(target)+' km y la próxima vez serán '+fmtKm(target+planned.step)+' km.</p>';
  return '<article class="card run-card anim" style="--i:'+i+'"><div class="lane"><span>'+esc(kind)+'</span><span class="lane-n">'+(planned? 'Plan del '+DOW_LONG[p.dow] : 'Fuera del plan')+'</span></div><div class="run-body">'+body+foot+'</div></article>';
}

function lineChart(pts,o){

(function stravaCallback(){
  let q; try{ q=new URLSearchParams(location.search) }catch(e){ return }
  const code=q.get('code'), state=q.get('state'), err=q.get('error');
  if(!code&&!err) return;
  try{ history.replaceState(null,'',location.pathname+'#km') }catch(e){}
  if(err){ setTimeout(()=>toast('No se conectó Strava: no diste permiso.'),900); return }

    const name=document.getElementById('x-name').value.trim();
    const prog=document.getElementById('x-prog').value==='reps'? 'reps' : 'kg';
    const mv=document.getElementById('x-mv').value;
    const sets=Math.round(num(document.getElementById('x-sets').value)), reps=Math.round(num(document.getElementById('x-reps').value));
    const w=num(document.getElementById('x-w').value), step=num(document.getElementById('x-step').value);
    if(!name){ showErr('x-err','Ponle nombre al ejercicio.'); return }
    if(!(sets>=1&&sets<=12)){ showErr('x-err','Las series van de 1 a 12.'); return }
    if(!(reps>=1&&reps<=100)){ showErr('x-err','Las repeticiones van de 1 a 100.'); return }
    if(!(w>=0)){ showErr('x-err','Escribe el peso en kg (0 si aún no lo sabes).'); return }
    if(!(step>0)){ showErr('x-err','Indica cuánto subir cada vez, por ejemplo 2,5.'); return }
    const {id,back}=sheetCtx, old=id? S.exercises[id] : null;
    const nid=id||slug(name)+'-'+uid();
    S.exercises[nid]={name, sets, reps, w:round2(w), step:prog==='reps'? Math.max(1,Math.round(step)) : round2(step), bar:prog==='kg'&&document.getElementById('x-bar').checked, prog, mv:MOV[mv]&&mv!=='run'? mv : 'idle', cal:old? !!old.cal : !(w>0), base:old&&old.base? old.base : undefined, rest:(+document.getElementById('x-rest').value)||0, wm:document.getElementById('x-wm').value==='lado'? 'lado' : 'total'};
    if(S.exercises[nid].base===undefined) delete S.exercises[nid].base;
    S.introDone=true;
    if(back&&back.today){ const L=ensureDay(todayKey()); L.extra=(L.extra||[]).filter(x=>x!==nid).concat(nid); closeSheet(); commit(); toast('Añadido a hoy: '+name); const c=document.querySelector('[data-exc="'+nid+'"]'); if(c) c.scrollIntoView({behavior:RM?'auto':'smooth', block:'start'}) }
    else if(back){ back.draft.ex.push(nid); commit(); openDayEditor(back.dow,back.draft) }
    else { closeSheet(); commit(); toast('Ejercicio guardado') }
  },
  'x-del':el=>{
    if(!armed(el,'Toca otra vez para eliminar')) return;
    const id=sheetCtx.id; delete S.exercises[id];
    for(let d=0;d<7;d++) S.days[d].ex=S.days[d].ex.filter(x=>x!==id);
    closeSheet(); commit(); toast('Ejercicio eliminado');
  },
  'recalib':el=>{ if(!armed(el,'Toca otra vez para recalibrar')) return; for(const id in S.exercises) S.exercises[id].cal=true; for(let d=0;d<7;d++) if(S.days[d].run) S.days[d].run.cal=true; delete S.runBase; const t=todayKey(); S.calib={start:t, end:addDays(t,6), seen:false}; commit(); toast('Semana de calibración reiniciada') },
  'clear-log':el=>{ if(!armed(el,'Toca otra vez para borrar todo el historial')) return; S.log={days:{}, claims:{}, counters:{}}; commit(); toast('Historial borrado') },
  'fin-day':()=>{ const L=S.log.days[todayKey()]; if(!(L&&logStats(L).trained)){ toast('Marca al menos una serie o guarda tu carrera para poder finalizar.'); return } openFinish() },
  'fin-save':()=>{
    const c=sheetCtx; if(!c||c.type!=='fin') return;
    const k=todayKey(), L=ensureDay(k), sm=sessionSum(k), end=Date.now(), nt=document.getElementById('fin-note');
    const dur=L.t0? Math.max(1,Math.round((end-L.t0)/60000+2)) : (L.run&&L.run.min? Math.round(L.run.min) : 0);
    let pid=(L.act&&L.act.photo)||null;
    if(c.photo){ const old=pid; pid='ac-'+uid(); savePhoto(pid,c.photo); if(old) deletePhoto(old) }
    L.act={end, dur, note:((nt&&nt.value)||'').trim().slice(0,280), photo:pid, title:sm.title};
    runClear(); closeSheet(); commit(); toast('Entrenamiento guardado en tus actividades');
    const card=document.getElementById('done-card'); if(card) card.scrollIntoView({behavior:RM?'auto':'smooth', block:'start'});
  },
  'cal-prev':()=>{ const m=ui.calM||todayKey().slice(0,7), d=new Date(+m.slice(0,4),+m.slice(5,7)-2,1); ui.calM=d.getFullYear()+'-'+pad(d.getMonth()+1); ui.calSel=null; render() },
  'cal-next':()=>{ const m=ui.calM||todayKey().slice(0,7), d=new Date(+m.slice(0,4),+m.slice(5,7),1); ui.calM=d.getFullYear()+'-'+pad(d.getMonth()+1); ui.calSel=null; render() },
  'cal-day':el=>{ ui.calSel=el.dataset.k; render(); const d=document.getElementById('cal-detail'); if(d) d.scrollIntoView({behavior:RM?'auto':'smooth', block:'nearest'}) },
  'act-more':()=>{ ui.actN=(ui.actN||8)+8; render() },
  'food-prev':()=>{ ui.foodDay=addDays(ui.foodDay||todayKey(),-1); render() },
  'food-next':()=>{ const t=todayKey(), n=addDays(ui.foodDay||t,1); ui.foodDay=n>t? t : n; render() },
  'meal':el=>{ ui.meal=el.dataset.m; render() },
  'food-setup':()=>{ const w=num(document.getElementById('fw').value); if(!(w>=30&&w<=250)){ toast('Escribe tu peso en kg, entre 30 y 250.'); return } S.profile.weight=round2(w); S.profile.goal=document.getElementById('fg').value; commit(); toast('Objetivos calculados') },
  'food-add':el=>{ const f=FOODS[+el.dataset.i]; if(!f) return; const k=(ui.foodDay&&ui.foodDay<=todayKey())? ui.foodDay : todayKey(); foodDay(k).items.push({id:uid(), meal:ui.meal||defaultMeal(), name:f[0]+' ('+f[1]+')', p:f[2], c:f[3], f:f[4], kcal:f[5], src:'lista'}); commit('food'); toast('Añadido: '+f[0]) },
  'food-manual':()=>openFoodItem(null),
  'food-edit':el=>openFoodItem(el.dataset.id),
  'fd-scale':el=>{ const x=+el.dataset.x; ['fd-p','fd-c','fd-f','fd-k'].forEach(id=>{ const inp=document.getElementById(id), v=num(inp.value); if(v>=0) inp.value=id==='fd-k'? Math.round(v*x) : nf1.format(round2(v*x)) }) },
  'fd-save':()=>{
    const c=sheetCtx; if(!c||c.type!=='food') return;
    const name=document.getElementById('fd-name').value.trim(), p=cl(num(document.getElementById('fd-p').value)), cc=cl(num(document.getElementById('fd-c').value)), f=cl(num(document.getElementById('fd-f').value)), kv=num(document.getElementById('fd-k').value);
    if(!name){ showErr('fd-err','Ponle nombre al alimento.'); return }
    const kcal=kv>0? Math.min(5000,Math.round(kv)) : Math.round(4*p+4*cc+9*f);
    if(!kcal){ showErr('fd-err','Escribe al menos las calorías o los gramos de algún macronutriente.'); return }
    const it={name:name.slice(0,60), meal:document.getElementById('fd-meal').value, p, c:cc, f, kcal}, day=foodDay(c.k);
    if(c.id){ const old=day.items.find(x=>x.id===c.id); if(old) Object.assign(old,it) } else day.items.push(Object.assign({id:uid(), src:'manual'},it));
    closeSheet(); commit('food'); toast('Guardado');
  },
  'fd-del':el=>{ if(!armed(el,'Toca otra vez para borrar')) return; const c=sheetCtx; if(!c||!c.id) return; const day=foodDay(c.k); day.items=day.items.filter(x=>x.id!==c.id); closeSheet(); commit('food'); toast('Borrado') },
  'food-ai':async()=>{
    const el=document.getElementById('food-txt'), txt=((el&&el.value)||'').trim();
    if(txt.length<3){ toast('Escribe qué has comido, por ejemplo «plato de lentejas y un yogur».'); return }
    const ai=await getAI();
    if(!ai){ ui.aiOff=true; render(); toast('La estimación con IA no está disponible aquí: usa la lista o añádelo a mano.'); return }
    const k=(ui.foodDay&&ui.foodDay<=todayKey())? ui.foodDay : todayKey(), meal=ui.meal||defaultMeal();
    ui.aiBusy=true; render();
    try{
      const r=await ai.json(AI_PROMPT+txt.slice(0,400), {modelTier:'quick'});
      const arr=Array.isArray(r)? r : (r&&Array.isArray(r.items)? r.items : []);
      const items=arr.slice(0,15).filter(x=>x&&typeof x==='object').map(x=>{ const p=cl(x.p), c=cl(x.c), f=cl(x.f), kk=+x.kcal; return {id:uid(), meal, name:String(x.name||'Alimento').slice(0,60), p, c, f, kcal:(kk>0&&kk<5000)? Math.round(kk) : Math.round(4*p+4*c+9*f), src:'ia'} }).filter(x=>x.kcal>0);
      ui.aiBusy=false;
      if(!items.length){ render(); toast('No he podido calcularlo. Prueba a describirlo con cantidades.'); return }
      items.forEach(it=>foodDay(k).items.push(it)); skipKeep=true; commit('food');
      toast('Añadido: '+items.length+' alimento'+(items.length==1?'':'s')+' · '+fmtInt(items.reduce((acc,x)=>acc+x.kcal,0))+' kcal');
    }catch(e){
      ui.aiBusy=false; const c=e&&e.code;
      if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){ ui.aiOff=true; render(); toast('La IA no está disponible: usa la lista o añádelo a mano.') }
      else { render(); toast(c==='rate_limited'? 'Demasiadas consultas seguidas. Prueba en un rato.' : c==='invalid_json'? 'No he entendido la respuesta. Descríbelo de otra forma.' : c==='cancelled'? 'Cancelado.' : 'No se pudo calcular ahora. Inténtalo de nuevo.') }
    }
  },
  'treat-pick':el=>{ ui.treat=el.dataset.t; render() },
  'treat-day':el=>{ ui.treatDay=el.dataset.k; render() },
  'treat-ok':()=>{ const mon=mondayOf(todayKey()); if(!ui.treat||!ui.treatDay||!rewardEarned(mon)) return; S.food.treats[mon]={day:ui.treatDay, treat:ui.treat}; ui.treat=ui.treatDay=null; commit('food'); toast('¡Capricho reservado!') },
  'treat-change':()=>{ const mon=mondayOf(todayKey()), tr=S.food.treats[mon]; if(!tr||tr.day<=todayKey()) return; ui.treat=tr.treat; ui.treatDay=tr.day; delete S.food.treats[mon]; commit('food') }
};
function stageStep(d){
  const k=todayKey(), p=planFor(k), L=S.log.days[k];
  const items=stageItems(p,!!p.run||!!(L&&L.run)||ui.freeRun); if(!items.length) return;
  const i=Math.max(0,items.indexOf(ui.stage));
  ui.stage=items[(i+d+items.length)%items.length]; ui.stagePinned=true; render();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const f=A[el.dataset.act]; if(!f) return;
  e.preventDefault(); f(el,e);
});
document.addEventListener('change',e=>{
  const t=e.target; if(!t) return;
  if(t.id==='soc-share'){ S.social=Object.assign({},S.social||{},{share:t.checked}); commit(); clearTimeout(shareT); publishShares(); toast(t.checked? 'Compartes tus entrenos con tus seguidores' : 'Has dejado de compartir'); return }
  if(t.dataset&&t.dataset.importjson){ const f=t.files&&t.files[0]; importData(f); t.value=''; return }
  if(t.dataset&&t.dataset.photo){ const f=t.files&&t.files[0]; handlePhoto(t.dataset.photo,f); t.value=''; return }
  if(t.dataset&&t.dataset.import){ const f=t.files&&t.files[0]; handleImport(f); t.value=''; return }
  if(t.dataset&&t.dataset.f&&t.dataset.ex){ setField(t.dataset.ex,t.dataset.f,num(t.value)); return }
  if(!t.id) return;
  if(t.id==='d-add'&&sheetCtx&&sheetCtx.type==='day'){
    const v=t.value; if(!v) return; syncDayDraft();
    if(v==='__new'){ openExEditor(null,{dow:sheetCtx.dow, draft:sheetCtx.draft}); return }
    if(S.exercises[v]&&!sheetCtx.draft.ex.includes(v)) sheetCtx.draft.ex.push(v);
    renderDaySheet();
  } else if(t.id==='d-run'){ document.getElementById('d-run-fields').hidden=!t.checked }
  else if(t.id==='x-mv'){ if(sheetCtx) sheetCtx.mvTouched=true; document.getElementById('x-prev').innerHTML=musPreview(t.value) }
  else if(t.id==='x-prog'){ const r=t.value==='reps'; document.getElementById('x-w-l').textContent=r? 'Lastre (kg, 0 = sin peso)' : 'Peso (kg)'; document.getElementById('x-step-l').textContent=r? 'Subir cada vez (reps)' : 'Subir cada vez (kg)'; document.getElementById('x-bar-row').hidden=r; const st=document.getElementById('x-step'); if(r&&num(st.value)!==Math.round(num(st.value))) st.value='1' }
  else if(t.id==='s-name'){ const v=t.value.replace(/\s+/g,' ').trim().slice(0,30); if(v){ S.profile.name=v; commit(); toast('Nombre guardado') } else t.value=S.profile.name }
  else if(t.id==='s-rest'){ const v=+t.value; S.settings.rest=isFinite(v)? v : -1; commit() }
  else if(t.id==='s-weight'){ const w=num(t.value); if(w>=30&&w<=250){ S.profile.weight=round2(w); commit(); toast('Peso guardado') } else if(!t.value.trim()){ S.profile.weight=0; commit() } else toast('Escribe tu peso en kg, entre 30 y 250.') }
  else if(t.id==='s-goal'){ S.profile.goal=GOALS.some(g=>g[0]===t.value)? t.value : 'musculo'; commit() }
  else if(t.id==='s-auto'){ S.settings.autoUp=t.checked; commit() }
});
let rtT=null;
document.addEventListener('input',e=>{
  const id=e.target&&e.target.id;
  if(id==='run-km'||id==='run-min'||id==='run-sec'){ updatePace(); const er=document.getElementById('run-err'); if(er) er.hidden=true }
  else if(id==='x-name'&&sheetCtx&&sheetCtx.type==='ex'&&!sheetCtx.mvTouched){ const g=guessMove(e.target.value), sel=document.getElementById('x-mv'); if(sel&&sel.value!==g){ sel.value=g; document.getElementById('x-prev').innerHTML=musPreview(g) } }
  else if(id==='soc-q'){ clearTimeout(socQT); const v=e.target.value; socQT=setTimeout(()=>socSearch(v),300) }
  else if(id==='ax-q'){ const l=document.getElementById('ax-list'); if(l) l.innerHTML=addExList(e.target.value) }
  else if(id==='food-q'){ ui.foodQ=e.target.value; const r=document.getElementById('food-res'); if(r) r.innerHTML=foodResults(e.target.value) }
  else if(id==='lg-name'){ lgSync(); const er=document.getElementById('lg-err'); if(er) er.hidden=true }
  else if(id==='rt-text'){ clearTimeout(rtT); const v=e.target.value; rtT=setTimeout(()=>{ const pv=document.getElementById('rt-prev'); if(pv) pv.innerHTML=routinePreview(v); const er=document.getElementById('rt-err'); if(er) er.hidden=true },250) }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!lg.open){ if(!sheetRoot.hidden) closeSheet(); else if(ov.open) closeOverlay() }
  if(e.key==='Enter'&&e.target&&e.target.dataset&&e.target.dataset.f){ e.target.blur() }
});
window.addEventListener('hashchange',()=>{
  const prev=lastTab, anc=document.getElementById('seg-anchor'), top=document.querySelector('.top');
  const target=anc? anc.getBoundingClientRect().top+window.scrollY-((top&&top.offsetHeight)||56) : 0;
  closeSheet(); render();
  if(prev&&anc&&screenOf(prev)==='perfil'&&screenOf(currentTab())==='perfil'){ if(window.scrollY>target) window.scrollTo(0,target) }
  else window.scrollTo(0,0);
});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(!document.activeElement||!document.activeElement.dataset||document.activeElement.dataset.f==null) render(); if(run.id) runTick() } });
const threeTag=document.getElementById('three-lib');
if(threeTag){ threeTag.addEventListener('load',()=>{ if(lg.open) lgMount(); else if(ov.open) ovShow(); else if(currentTab()==='hoy') mountStage() }) }

render();
if(sb){
  openLogin('loading');
  sb.auth.getSession().then(r=>{ const se=r&&r.data&&r.data.session; if(se) startSession(se.user,''); else { lg.step='signin'; lgRender() } }).catch(()=>{ lg.step='signin'; lgRender() });
} else {
  if(!(sessIn()&&S.profile.name)) openLogin('name');
  goLocal();
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}) });
})();
</script>
